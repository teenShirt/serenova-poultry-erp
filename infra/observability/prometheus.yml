# Prometheus for the local docker-compose stack. In Kubernetes, kube-prometheus-stack scrapes the
# app through the Helm chart's ServiceMonitor instead.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: poultry-app
    static_configs:
      - targets: ['app:9100']

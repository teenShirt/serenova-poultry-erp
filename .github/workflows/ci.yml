# Checks every change before it can reach main.
# Branches: work happens on `test`; `main` only receives changes from `test` that passed these checks.
name: CI

on:
  push:
    branches: [test, main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 25

    services:
      mysql:
        image: mysql:8.4
        env:
          # Throw-away server for this run only; not a real credential.
          MYSQL_ROOT_PASSWORD: ci-only
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pci-only"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30

    env:
      TEST_DB_HOST: 127.0.0.1
      TEST_DB_PORT: 3306
      TEST_DB_USER: root
      TEST_DB_PASSWORD: ci-only

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Formatting
        run: npm run format:check

      - name: Typecheck
        run: npm run typecheck

      - name: Lint (includes the "every database call is awaited" rules)
        run: npm run lint

      - name: Tests (MySQL 8.4; includes backup/restore and concurrent-write tests)
        run: npm test

      - name: Build
        run: npm run build

      - name: Deployment scripts are valid shell
        run: for f in scripts/deploy/*.sh; do bash -n "$f"; done

      - name: Staging-style start and smoke test (empty database, every migration, production build)
        env:
          APP_ENV: staging
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_USER: root
          DB_PASSWORD: ci-only
          DB_NAME: ci_smoke
          DEMO_ENABLED: 'false'
          PORT: 3100
          RELEASE_SHA: ${{ github.sha }}
        run: |
          node dist/server/index.js > /tmp/server.log 2>&1 &
          for i in $(seq 1 60); do curl -fsS http://127.0.0.1:3100/readyz > /dev/null 2>&1 && break; sleep 1; done
          node scripts/smoke-test.mjs http://127.0.0.1:3100 "$(node -p "require('./package.json').version")" || { cat /tmp/server.log; exit 1; }

      - name: Dependency audit (fail on high or critical issues in production packages)
        run: npm audit --omit=dev --audit-level=high

# Local production-like stack: app + MySQL + Prometheus + Grafana.
#   docker compose up --build
#   App http://localhost:3000 · Prometheus http://localhost:9090 · Grafana http://localhost:3001 (admin / admin)
# Development passwords only; real deployments take secrets from Kubernetes (see infra/).
services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: local-root
      MYSQL_DATABASE: poultry_farm
      MYSQL_USER: poultry
      MYSQL_PASSWORD: local-only
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', '127.0.0.1', '-uroot', '-plocal-root']
      interval: 5s
      retries: 30

  app:
    build: .
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      APP_ENV: staging
      DB_HOST: mysql
      DB_USER: poultry
      DB_PASSWORD: local-only
      DB_NAME: poultry_farm
      DEMO_ENABLED: 'false'
      METRICS_PORT: '9100'
    ports:
      - '3000:3000'
    volumes:
      - app-data:/data

  prometheus:
    image: prom/prometheus:v3.5.0
    volumes:
      - ./infra/observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./infra/helm/poultry/files/alerts.yml:/etc/prometheus/alerts.yml:ro
    ports:
      - '9090:9090'

  grafana:
    image: grafana/grafana:12.1.0
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - ./infra/observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/helm/poultry/files/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - '3001:3000'

volumes:
  mysql-data:
  app-data:
